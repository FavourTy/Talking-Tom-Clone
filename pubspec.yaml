name: talking_tom_clone
description: A Talking Tom clone application converted from Unity to Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Audio recording
  record: ^5.0.4
  
  # Audio playback
  audioplayers: ^5.2.1
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Path provider for file storage
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Add character images/assets here
  # assets:
  #   - assets/images/
  #   - assets/animations/
